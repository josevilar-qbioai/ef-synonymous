name: Publish to PyPI

# Publica en PyPI al empujar un tag v* (p. ej. v0.2.0), vía Trusted Publishing
# (OIDC) — sin tokens ni secretos en el repo ni en tu máquina.
#
# Requisito único (una vez, en pypi.org): configurar el "trusted publisher"
#   Owner: josevilar-qbioai · Repo: ef-synonymous
#   Workflow: publish.yml · Environment: pypi
# Para un proyecto nuevo, usa el flujo "pending publisher" en
#   pypi.org → Account settings → Publishing.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - run: pytest tests/ -q

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # El tag (vX.Y.Z) debe coincidir con la versión del paquete.
      - name: Verificar que el tag coincide con la versión
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/version = "(.*)"/\1/')
          echo "tag=$TAG  pyproject=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::El tag v$TAG no coincide con la versión del paquete ($PKG). Bumpea o re-taggea."
            exit 1
          fi
      - run: |
          python -m pip install --upgrade build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi          # debe coincidir con el trusted publisher en PyPI
    permissions:
      id-token: write          # OIDC: necesario para trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publicar en PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
