[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ef-synonymous"
version = "0.2.1"
description = "Glass-box thermodynamic scoring of synonymous variants (signed stacking ΔΔG + G>A)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Jose Antonio Vilar Sanchez", email = "qmetrika@proton.me" }]
keywords = ["genomics", "synonymous", "variant", "pathogenicity", "mRNA", "thermodynamics", "ACMG"]
dependencies = ["numpy>=1.20"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/josevilar-qbioai/ef-synonymous"
Repository = "https://github.com/josevilar-qbioai/ef-synonymous"
Issues = "https://github.com/josevilar-qbioai/ef-synonymous/issues"
Paper = "https://doi.org/10.5281/zenodo.20275792"

[project.scripts]
ef-syn = "ef_synonymous.cli:main"

[tool.setuptools]
packages = ["ef_synonymous"]

[tool.setuptools.package-data]
ef_synonymous = ["model.json"]
